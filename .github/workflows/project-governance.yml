name: Validate Project Governance

on:
  pull_request:
    paths:
      - "START_HERE.md"
      - "AGENTS.md"
      - "HARC_MANIFEST.yaml"
      - "HARC_CONTEXT_INTERFACE.yaml"
      - "CONTRIBUTING.md"
      - "CITATION.cff"
      - "README.md"
      - "Makefile"
      - ".gitignore"
      - "core/**"
      - "docs/working-memory/**"
      - "evidence/**"
      - "scripts/check_project_state.py"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/project-governance.yml"
  push:
    branches: [main]
    paths:
      - "START_HERE.md"
      - "AGENTS.md"
      - "HARC_MANIFEST.yaml"
      - "HARC_CONTEXT_INTERFACE.yaml"
      - "CONTRIBUTING.md"
      - "CITATION.cff"
      - "README.md"
      - "Makefile"
      - ".gitignore"
      - "core/**"
      - "docs/working-memory/**"
      - "evidence/**"
      - "scripts/check_project_state.py"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/project-governance.yml"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate repository collaboration state
        run: python scripts/check_project_state.py
