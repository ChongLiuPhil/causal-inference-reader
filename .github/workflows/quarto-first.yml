name: Quarto Book

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - book-reader-site
  pull_request:
    branches:
      - main
      - content-audit-deepening

permissions:
  contents: write

concurrency:
  group: quarto-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install one-time migration dependencies
        if: ${{ hashFiles('main.tex') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-chinese texlive-pictures \
            fonts-noto-cjk pdf2svg

      - name: Convert the legacy LaTeX manuscript once
        if: ${{ hashFiles('main.tex') != '' }}
        run: |
          set -euo pipefail
          test -f scripts/build_web_source.py
          python scripts/build_web_source.py
          test -d web-manuscript
          test "$(find web-manuscript -maxdepth 1 -name '*.qmd' | wc -l)" -ge 17

          rm -rf manuscript
          mv web-manuscript manuscript
          if [ -d web-assets ]; then
            rm -rf assets
            mv web-assets assets
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          main = (root / 'main.tex').read_text(encoding='utf-8')
          inputs = re.findall(r'\\(?:input|include)\{chapters/([^}]+)\}', main)
          if not inputs:
              raise SystemExit('Could not recover chapter order from main.tex')

          names = [Path(p if p.endswith('.tex') else p + '.tex').stem for p in inputs]
          qmds = {p.stem for p in (root / 'manuscript').glob('*.qmd')}
          missing = [name for name in names if name not in qmds]
          if missing:
              raise SystemExit(f'Missing converted QMD files: {missing}')

          prelim = [n for n in names if not n.startswith('chapter-') and not n.startswith('appendix-')]
          numbered = []
          appendices = []
          for n in names:
              m = re.match(r'chapter-(\d+)-', n)
              if m:
                  numbered.append((int(m.group(1)), n))
              elif n.startswith('appendix-'):
                  appendices.append(n)

          numbered.sort()
          parts = [
              ('第一部　问题、历史与哲学', [n for i, n in numbered if 1 <= i <= 3]),
              ('第二部　识别、结构与估计', [n for i, n in numbered if 4 <= i <= 7]),
              ('第三部　发现、迁移与应用', [n for i, n in numbered if 8 <= i <= 11]),
          ]

          lines = [
              'project:',
              '  type: book',
              '  output-dir: _book',
              '',
              'book:',
              '  title: "因果推理深度读本"',
              '  subtitle: "从哲学、潜在结果与结构因果模型到发现、迁移与因果机器学习"',
              '  author: "ChongLiuPhil"',
              '  site-url: https://chongliuphil.github.io/causal-inference-reader/',
              '  repo-url: https://github.com/ChongLiuPhil/causal-inference-reader',
              '  repo-branch: main',
              '  repo-actions: [edit, issue, source]',
              '  search: true',
              '  page-navigation: true',
              '  downloads: [epub]',
              '  chapters:',
              '    - index.qmd',
          ]
          for n in prelim:
              lines.append(f'    - manuscript/{n}.qmd')
          for title, chapter_names in parts:
              lines.append(f'    - part: "{title}"')
              lines.append('      chapters:')
              for n in chapter_names:
                  lines.append(f'        - manuscript/{n}.qmd')
          lines.append('    - references.qmd')
          if appendices:
              lines.append('  appendices:')
              for n in appendices:
                  lines.append(f'    - manuscript/{n}.qmd')
          lines += [
              '  page-footer:',
              '    left: "因果推理深度读本"',
              '    right: "Built with Quarto"',
              '',
              'bibliography: references.bib',
              'lang: zh-CN',
              '',
              'crossref:',
              '  appendix-title: "附录"',
              '  appendix-delim: "："',
              '',
              'format:',
              '  html:',
              '    theme: cosmo',
              '    css: book.css',
              '    toc: true',
              '    toc-depth: 3',
              '    number-sections: true',
              '    citations-hover: true',
              '    footnotes-hover: true',
              '    link-external-newwindow: true',
              '  epub:',
              '    toc: true',
              '    css: epub.css',
              '    epub-chapter-level: 1',
              '',
          ]
          (root / '_quarto.yml').write_text('\n'.join(lines), encoding='utf-8')

          epub_css = '''
          body { font-family: serif; line-height: 1.7; }
          h1, h2, h3 { line-height: 1.3; }
          img, svg { max-width: 100%; height: auto; }
          table { width: 100%; border-collapse: collapse; }
          th, td { padding: 0.35em 0.5em; vertical-align: top; }
          .callout { margin: 1em 0; padding: 0.8em 1em; border-left: 0.25em solid #5b7894; }
          code { white-space: pre-wrap; }
          '''.strip() + '\n'
          (root / 'epub.css').write_text(epub_css, encoding='utf-8')

          readme = '''# 因果推理深度读本

这是一本以 **Quarto** 为唯一权威源的中文因果推理进阶读本。项目同时面向在线阅读与电子书流通。

## 阅读与输出

- 在线版：<https://chongliuphil.github.io/causal-inference-reader/>
- HTML：`quarto render --to html`
- EPUB：`quarto render --to epub`
- 全部格式：`quarto render`
- 本地预览：`quarto preview`

正文位于 `manuscript/*.qmd`，章节结构由 `_quarto.yml` 统一管理，引用继续使用 `references.bib`。不再维护 LaTeX 版正文，也不维护 LaTeX→QMD 的同步层。

## 编辑原则

- `manuscript/*.qmd` 是唯一正文源。
- 数学公式使用 Quarto/Pandoc Markdown 中的 LaTeX 数学语法（如 `$...$` 与 `$$...$$`）；这只是公式标记，不意味着项目仍以 LaTeX 文档为源。
- 引用使用 Pandoc/Quarto citation 语法，并统一指向 `references.bib`。
- 网页阅读样式位于 `book.css`，EPUB 样式位于 `epub.css`。
- 修改后运行 `make check`，同时验证 HTML 与 EPUB。

## 结构

全书保持 3 个部分、11 章和 4 个附录。GitHub Actions 会在 pull request 上验证构建；合并到 `main` 后发布 HTML 到 GitHub Pages，并保留 EPUB 构建产物。
'''
          (root / 'README.md').write_text(readme, encoding='utf-8')

          makefile = '''.PHONY: preview html epub render check clean

preview:
\tquarto preview

html:
\tquarto render --to html

epub:
\tquarto render --to epub

render:
\tquarto render

check:
\tpython scripts/check_quarto_source.py
\tquarto render --to html
\tquarto render --to epub
\ttest -f _book/index.html
\ttest -n "$$(find _book -maxdepth 1 -name '*.epub' -print -quit)"

clean:
\trm -rf _book .quarto
'''
          (root / 'Makefile').write_text(makefile, encoding='utf-8')

          checker = r'''from pathlib import Path
          import re
          import sys

          root = Path(__file__).resolve().parents[1]
          manuscript = root / "manuscript"
          files = sorted(manuscript.glob("*.qmd"))
          chapters = sorted(manuscript.glob("chapter-*.qmd"))
          appendices = sorted(manuscript.glob("appendix-*.qmd"))
          errors = []

          if len(chapters) != 11:
              errors.append(f"expected 11 chapters, found {len(chapters)}")
          if len(appendices) != 4:
              errors.append(f"expected 4 appendices, found {len(appendices)}")
          if len(files) < 17:
              errors.append(f"expected at least 17 manuscript QMD files, found {len(files)}")

          text = "\n".join(p.read_text(encoding="utf-8") for p in files)
          for token in ("TODO", "TBD", "FIXME", "待补", "待写", "占位"):
              if token in text:
                  errors.append(f"placeholder token remains: {token}")

          legacy = [
              r"\\chapter\{", r"\\section\{", r"\\subsection\{",
              r"\\textcite\{", r"\\parencite\{", r"\\begin\{document\}",
              r"\\begin\{chapter", r"\\term\{",
          ]
          for pattern in legacy:
              if re.search(pattern, text):
                  errors.append(f"legacy document-level LaTeX remains: {pattern}")

          bib = (root / "references.bib").read_text(encoding="utf-8")
          bibkeys = set(re.findall(r"@[A-Za-z]+\s*\{\s*([^,\s]+)", bib))
          cited = set(re.findall(r"(?<![\w@])@([A-Za-z0-9_:.+-]+)", text))
          missing = sorted(k for k in cited if k not in bibkeys)
          if missing:
              errors.append("missing bibliography keys: " + ", ".join(missing[:20]))

          if errors:
              print("Quarto source validation failed:", file=sys.stderr)
              for error in errors:
                  print(f"- {error}", file=sys.stderr)
              raise SystemExit(1)
          print(f"Validated {len(chapters)} chapters, {len(appendices)} appendices, {len(cited)} cited keys.")
          '''
          checker = '\n'.join(line[10:] if line.startswith('          ') else line for line in checker.splitlines()) + '\n'
          scripts = root / 'scripts'
          scripts.mkdir(exist_ok=True)
          (scripts / 'check_quarto_source.py').write_text(checker, encoding='utf-8')

          gitignore = (root / '.gitignore').read_text(encoding='utf-8') if (root / '.gitignore').exists() else ''
          additions = ['_book/', '.quarto/', 'web-manuscript/', 'web-assets/']
          for item in additions:
              if item not in gitignore.splitlines():
                  gitignore += ('\n' if gitignore and not gitignore.endswith('\n') else '') + item + '\n'
          (root / '.gitignore').write_text(gitignore, encoding='utf-8')
          PY

          python scripts/check_quarto_source.py

          git rm -r chapters
          git rm -f main.tex bookstyle.tex project.yaml website.yaml scripts/build_web_source.py 2>/dev/null || true
          git rm -f "因果推理深度读本.pdf" 2>/dev/null || true

          # Disable the previous LaTeX-derived web workflow if one exists.
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue
            [ "$f" = ".github/workflows/quarto-first.yml" ] && continue
            if grep -Eq 'build_web_source\.py|TinyTeX|texlive|xelatex' "$f"; then
              git rm -f "$f"
            fi
          done

          git add manuscript assets _quarto.yml epub.css README.md Makefile .gitignore scripts/check_quarto_source.py 2>/dev/null || true
          git add -A

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Make Quarto the canonical book source"
            if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "book-reader-site" ]; then
              git push origin HEAD:book-reader-site
            fi
          fi

      - name: Validate canonical Quarto source
        run: python scripts/check_quarto_source.py

      - name: Render HTML
        run: quarto render --to html

      - name: Preserve HTML build
        run: |
          rm -rf _book-html
          cp -a _book _book-html

      - name: Render EPUB
        run: quarto render --to epub

      - name: Collect EPUB
        run: |
          mkdir -p dist
          find _book -maxdepth 1 -name '*.epub' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -name '*.epub' -print -quit)"

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: causal-inference-reader-epub
          path: dist/*.epub

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: causal-inference-reader-html
          path: _book-html

      - name: Publish HTML to gh-pages
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _book-html
          force_orphan: true
