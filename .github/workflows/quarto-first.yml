name: Quarto Migration

on:
  workflow_dispatch:
  push:
    branches:
      - book-reader-site

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate manuscript to canonical Quarto sources
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f main.tex ]; then
            echo "Repository is already Quarto-first."
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-chinese texlive-pictures \
            fonts-noto-cjk pdf2svg

          python scripts/build_web_source.py
          python scripts/migrate_to_quarto.py
          python scripts/check_quarto_source.py

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make Quarto the canonical book source"
          git push origin HEAD:book-reader-site
