name: One-time Quarto Migration

on:
  workflow_dispatch:
  push:
    branches: [book-reader-site]
    paths:
      - "scripts/migrate_to_quarto.py"
      - "scripts/build_web_source.py"
      - ".github/workflows/quarto-first.yml"

permissions:
  contents: write

concurrency:
  group: quarto-one-time-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install one-time migration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-chinese texlive-pictures \
            fonts-noto-cjk dvisvgm

      - name: Run intermediate source generator
        shell: bash
        run: |
          set -uo pipefail
          test -f main.tex
          rm -f migration-error.log migration-generator.log
          set +e
          python scripts/build_web_source.py > migration-generator.log 2>&1
          status=$?
          set -e
          cat migration-generator.log
          if [ "$status" -ne 0 ]; then
            {
              printf 'generator_exit=%s\n' "$status"
              cat migration-generator.log
            } > migration-error.log
            exit "$status"
          fi
          rm -f migration-generator.log

      - name: Persist generator failure diagnostic
        if: failure()
        shell: bash
        run: |
          set -euxo pipefail
          test -f migration-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f migration-error.log
          git commit -m "Capture migration generator failure"
          git push origin HEAD:book-reader-site

      - name: Verify intermediate QMD and SVG assets
        shell: bash
        run: |
          set -euxo pipefail
          test -d web-manuscript
          find web-manuscript -maxdepth 1 -name '*.qmd' -print
          qmd_count="$(find web-manuscript -maxdepth 1 -name '*.qmd' | wc -l)"
          echo "Generated QMD count: ${qmd_count}"
          test "${qmd_count}" -eq 17
          test -d web-assets
          find web-assets -type f -print
          find web-assets -type f -print -quit | grep -q .

      - name: Freeze canonical QMD sources
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/migrate_to_quarto.py

      - name: Validate frozen canonical sources
        shell: bash
        run: |
          set -euxo pipefail
          python scripts/check_quarto_source.py
          test -f _quarto.yml
          test -f index.qmd
          test -f references.qmd
          test -f references.bib
          test -f book.css
          test -d manuscript
          test -d assets
          test -f manuscript/01-questions.qmd
          test -f manuscript/04-potential-outcomes-identification.qmd
          test -f manuscript/07-design-estimation.qmd
          test -f manuscript/11-synthesis-open-problems.qmd
          test -f manuscript/appendix-A-comparative-topics.qmd
          test "$(find manuscript -maxdepth 1 -name '*.qmd' | wc -l)" -eq 17
          find assets -type f -print -quit | grep -q .

      - name: Verify migration layer is removed
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e main.tex
          test ! -e bookstyle.tex
          test ! -d chapters
          test ! -d web-manuscript
          test ! -d web-assets
          test ! -e scripts/build_web_source.py
          test ! -e scripts/migrate_to_quarto.py
          test ! -e .github/workflows/quarto-first.yml

      - name: Commit canonical Quarto sources and remove migration layer
        run: |
          set -euxo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make manuscript QMD the canonical book source"
          git push origin HEAD:book-reader-site
